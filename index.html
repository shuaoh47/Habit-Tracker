<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AURA Habit Tracker</title>
  <!-- Outfit & Inter Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="light-theme">
  
  <!-- Mobile App Shell Wrapper -->
  <div class="app-shell">
    
    <!-- Header -->
    <header class="app-header">
      <!-- Quick Metrics -->
      <div class="header-badges">
        <div class="stat-badge streak-badge" id="header-streak-badge" title="현재 최고 연속 성공 일수">
          <span class="emoji">🔥</span>
          <span class="value" id="global-streak">0</span>
        </div>
      </div>
    </header>

    <!-- Main Views Container -->
    <main class="app-content">
      
      <!-- TAB 1: 오늘 실천 목록 -->
      <section id="view-today" class="tab-view active">
        
        <!-- Today's Checklist Section -->
        <div class="checklist-section">
          <div class="section-header">
            <!-- Quick Add button visible in today tab -->
            <button class="btn btn-primary btn-round-add" commandfor="habit-modal" command="show-modal" aria-label="습관 추가">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
          </div>

          <div class="habit-list-container" id="habit-list-container">
            <div class="empty-state">
              <p>기록된 습관이 없습니다.<br>아래 보관함 탭에서 새 습관을 추가해 보세요!</p>
            </div>
          </div>
        </div>
        
      </section>

      <!-- TAB 2: 달력 스트릭 뷰 -->
      <section id="view-calendar" class="tab-view">
        <div class="calendar-section">
          
          <div class="section-header-compact">
            <h2 class="section-title">달력 스트릭</h2>
            <p class="section-subtitle">연속 성공 일수가 한눈에 이어집니다.</p>
          </div>

          <!-- Habit Selector dropdown -->
          <div class="calendar-selector-wrapper">
            <select class="select-input" id="calendar-habit-select">
              <option value="global">전체 습관 현황</option>
              <!-- Populated dynamically -->
            </select>
          </div>

          <!-- Calendar Block -->
          <div class="calendar-card">
            <div class="calendar-header">
              <button class="calendar-nav-btn" id="cal-prev-btn">&lt;</button>
              <h3 class="calendar-month-year" id="cal-month-year">2026년 5월</h3>
              <button class="calendar-nav-btn" id="cal-next-btn">&gt;</button>
            </div>

            <div class="calendar-grid-wrapper">
              <div class="calendar-weekdays">
                <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
              </div>
              <div class="calendar-days" id="calendar-days-container"></div>
            </div>

            <!-- Calendar Visual Legend -->
            <div class="calendar-legend">
              <div class="legend-item">
                <span class="legend-dot start-date"></span>
                <span class="legend-text">시작일</span>
              </div>
              <div class="legend-item">
                <span class="legend-dot end-date"></span>
                <span class="legend-text">종료일</span>
              </div>
              <div class="legend-item">
                <span class="legend-dot success-date"></span>
                <span class="legend-text">완료</span>
              </div>
            </div>
          </div>
          
        </div>
      </section>

      <!-- TAB 3: 습관 보관함 & 관리 -->
      <section id="view-directory" class="tab-view">
        <div class="directory-section">
          
          <div class="section-header">
            <div>
              <h2 class="section-title">습관 보관함</h2>
              <p class="section-subtitle">보관된 나의 습관들을 관리합니다.</p>
            </div>
            <button class="btn btn-primary add-habit-btn" commandfor="habit-modal" command="show-modal">
              습관 추가
            </button>
          </div>

          <div class="directory-list" id="directory-list-container">
            <!-- Directory lists will be populated here -->
          </div>
          
        </div>
      </section>
      
    </main>

    <!-- FIXED BOTTOM NAVIGATION BAR -->
    <nav class="bottom-nav">
      <button class="nav-tab active" data-tab="view-today">
        <span class="nav-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 11l3 3L22 4"></path>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
          </svg>
        </span>
        <span class="nav-label">오늘</span>
      </button>
      <button class="nav-tab" data-tab="view-calendar">
        <span class="nav-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
        </span>
        <span class="nav-label">달력</span>
      </button>
      <button class="nav-tab" data-tab="view-directory">
        <span class="nav-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg>
        </span>
        <span class="nav-label">보관함</span>
      </button>
    </nav>

  </div>

  <!-- ==================== DIALOGS / OVERLAYS ==================== -->

  <!-- ADD / EDIT HABIT DIALOG (Bottom Sheet style in mobile CSS) -->
  <dialog id="habit-modal" closedby="any" class="premium-dialog">
    <div class="dialog-header">
      <h2 id="modal-title">새로운 습관 만들기</h2>
      <button class="close-btn" commandfor="habit-modal" command="close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    
    <form id="habit-form" class="dialog-form">
      <input type="hidden" id="edit-habit-id" value="">
      
      <div class="form-group">
        <label for="habit-name" class="required">습관 이름</label>
        <input type="text" id="habit-name" placeholder="예: 독서, 팔굽혀펴기, 영어 공부" required class="text-input">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="habit-qty" class="required">목표 수량</label>
          <input type="number" id="habit-qty" min="1" placeholder="예: 30" required class="text-input">
        </div>
        <div class="form-group">
          <label for="habit-unit" class="required">단위</label>
          <input type="text" id="habit-unit" placeholder="예: 분, 쪽, 개" required class="text-input">
        </div>
      </div>

      <div class="form-group">
        <label class="required">카테고리</label>
        <div class="category-grid">
          <label class="cat-label health">
            <input type="radio" name="habit-category" value="health" checked>
            <span class="cat-chip">건강</span>
          </label>
          <label class="cat-label study">
            <input type="radio" name="habit-category" value="study">
            <span class="cat-chip">학습</span>
          </label>
          <label class="cat-label mind">
            <input type="radio" name="habit-category" value="mind">
            <span class="cat-chip">명상</span>
          </label>
          <label class="cat-label finance">
            <input type="radio" name="habit-category" value="finance">
            <span class="cat-chip">자산</span>
          </label>
          <label class="cat-label creative">
            <input type="radio" name="habit-category" value="creative">
            <span class="cat-chip">취미</span>
          </label>
          <label class="cat-label routine">
            <input type="radio" name="habit-category" value="routine">
            <span class="cat-chip">일상</span>
          </label>
        </div>
      </div>

      <div class="form-group">
        <label for="habit-frequency">실천 빈도</label>
        <select id="habit-frequency" class="select-input">
          <option value="daily">매일 (Daily)</option>
          <option value="weekly-5">주 5회</option>
          <option value="weekly-3">주 3회</option>
          <option value="weekly-2">주 2회</option>
          <option value="weekly-1">주 1회</option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="habit-start-date" class="required">시작 날짜</label>
          <input type="date" id="habit-start-date" required class="text-input">
        </div>
        <div class="form-group">
          <label for="habit-end-date">종료 날짜 (선택)</label>
          <input type="date" id="habit-end-date" class="text-input">
        </div>
      </div>

      <div class="dialog-actions">
        <button type="button" class="btn btn-secondary" commandfor="habit-modal" command="close">취소</button>
        <button type="submit" class="btn btn-primary" id="save-habit-btn">만들기</button>
      </div>
    </form>
  </dialog>

  <!-- Fallback script for dialog popovers and invokers feature detection -->
  <script type="module">
    // Dialog light-dismiss fallback
    if (!('closedBy' in HTMLDialogElement.prototype)) {
      document.querySelectorAll('dialog[closedby="any"]').forEach(dialog => {
        dialog.addEventListener('click', (event) => {
          if (event.target !== dialog) return;
          const rect = dialog.getBoundingClientRect();
          const isInside = (
            rect.top <= event.clientY &&
            event.clientY <= rect.top + rect.height &&
            rect.left <= event.clientX &&
            event.clientX <= rect.left + rect.width
          );
          if (!isInside) {
            dialog.close();
          }
        });
      });
    }

    // Declarative invokers fallback
    if (!('commandForElement' in HTMLButtonElement.prototype)) {
      document.addEventListener('click', (event) => {
        const button = event.target.closest('button[commandfor]');
        if (!button) return;

        const targetId = button.getAttribute('commandfor');
        const command = button.getAttribute('command');
        const target = document.getElementById(targetId);

        if (target && command) {
          if (target.tagName === 'DIALOG') {
            if (command === 'show-modal') {
              target.showModal();
            } else if (command === 'close') {
              target.close();
            }
          }
        }
      });
    }
  </script>

  <!-- Core JavaScript Logic -->
  <script src="app.js"></script>
</body>
</html>
